## Summary

Explain the problem and the smallest solution implemented by this pull request.

## Verification

- [ ] `cargo fmt --check`
- [ ] `cargo clippy --all-targets --all-features -- -D warnings`
- [ ] `cargo test --all-features`
- [ ] Public API and security implications were reviewed
- [ ] Documentation or changelog was updated when required

## Safety notes

Describe overflow, replay, compatibility, and migration considerations. Do not include private keys, seed phrases, or production secrets.
