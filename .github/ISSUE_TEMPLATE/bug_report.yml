name: Feature request
description: Propose a focused addition to the public API or developer experience.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the concrete use case that is not covered today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API and behavior you would like to add.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility
      description: Note overflow, replay, compatibility, or migration considerations.
    validations:
      required: true
